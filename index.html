<style>
  /* Meta Ray-Ban Display ready: 600x600, black = see-through, no scrolling,

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }

  .tiny { font-size: 14px; color: #9de; }
  button { font: inherit; }
  .btn { background: #000; color: #8ff; border: 2px solid #8ff; border-radius: 6px; padding: 9px 13px; font-size: 15px; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
  button:focus, button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; box-shadow: 0 0 14px #fff8; }
  button:disabled { cursor: default; }
  .menu { display: grid; gap: 10px; margin-top: 12px; }
  .mi { text-align: left; background: #000; border: 2px solid; border-radius: 8px; padding: 11px 14px; cursor: pointer; color: #e4f6ff; }

  .mi small { font-size: 14px; color: #9de; }

  .card { border: 2px solid #8ff6; border-radius: 8px; padding: 12px 14px; margin-top: 8px; }
  .opt { display: block; width: 100%; text-align: left; margin-top: 7px; background: #000; color: #e4f6ff; border: 2px solid #8ff8; border-radius: 6px; padding: 9px 12px; font-size: 16px; line-height: 1.25; cursor: pointer; }

  .opt.bad { border-color: #ff2bd6; color: #ff2bd6; }

  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
  .bar { height: 7px; background: #8ff3; border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #8ff, #b388ff); }
  .fb { font-size: 15px; line-height: 1.3; margin: 0; }
  .big { font-size: 46px; margin: 6px 0; }
  .grow { flex: 1; min-height: 0; }
</style>

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a, n) { return shuffle(a).slice(0, n); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
const TOTAL = DOM.reduce((n, d) => n + d.m.length, 0);
function cleared() { return Object.keys(S.clr).length; }

function rank() { const x = S.xp; return x >= 3000 ? "Security+ Ready" : x >= 2000 ? "Threat Hunter" : x >= 1200 ? "SOC Analyst" : x >= 600 ? "Blue Team Recruit" : x >= 200 ? "Packet Sniffer" : "Script Kiddie"; }

/* Question builders: every question = { p: prompt, o: [options], a: correct index, x: explanation, tag: [d, mi] } */
function mk(p, right, wrongs, x, tag) {
  const o = shuffle([right].concat(wrongs));
  return { p: p, o: o, a: o.indexOf(right), x: x, tag: tag };
}
function termQ(d, mi, k) {
  const mod = DOM[d].m[mi], t = mod.t[k];
  let pool = mod.t.filter((_, j) => j !== k).map(x => x[0]);
  if (pool.length < 3) pool = pool.concat(DOM[d].m.flatMap(m => m.t.map(x => x[0])).filter(n => n !== t[0]));
  return mk("Which term matches? " + t[1], t[0], pick(pool, 3), t[0] + ": " + t[1], [d, mi]);
}
function scenQ(d, mi, k) { const q = DOM[d].m[mi].q[k]; return mk(q[0], q[1], [q[2], q[3], q[4]], q[5], [d, mi]); }
function moduleQs(d, mi) {
  const m = DOM[d].m[mi];
  return shuffle(m.t.map((_, k) => termQ(d, mi, k)).concat(m.q.map((_, k) => scenQ(d, mi, k))));
}
function anyQ(d) {
  const mi = Math.floor(Math.random() * DOM[d].m.length), m = DOM[d].m[mi];
  return Math.random() < 0.45 ? scenQ(d, mi, Math.floor(Math.random() * m.q.length)) : termQ(d, mi, Math.floor(Math.random() * m.t.length));
}
function weightedDomain() { let r = Math.random() * 100; for (let d = 0; d < DOM.length; d++) { r -= DOM[d].w; if (r < 0) return d; } return 3; }
function examQs(n) {
  const out = [];
  DOM.forEach((dm, d) => { const k = Math.round(n * dm.w / 100); for (let i = 0; i < k; i++) out.push(anyQ(d)); });
  return shuffle(out).slice(0, n);
}
function acrQ() {
  const t = ACR[Math.floor(Math.random() * ACR.length)];
  return mk("What does " + t[0] + " stand for?", t[1], pick(ACR.filter(x => x !== t).map(x => x[1]), 3), t[0] + " = " + t[1], null);
}

  let head = "", sub = "", extra = "";
  if (V.mode === "drill") {
    const pass = pct >= 80;
    head = pass ? "MODULE CLEARED" : "NOT YET";
    sub = pass ? "Nice. " + esc(DOM[V.d].m[V.mi].n) + " is locked in." : "You need 80% to clear. Review the cards and run it again.";
  } else if (V.mode === "exam") {
    const scaled = Math.round(100 + 800 * V.score / n);
    head = scaled + " / 900"; sub = scaled >= 750 ? "PASS. Exam-ready pace on this run." : "Below 750. Weak spots are listed below.";
    const weak = Object.entries(V.miss).sort((a, b) => b[1] - a[1]).slice(0, 3).map(e => { const t = e[0].split("-"); return esc(DOM[+t[0]].m[+t[1]].n) + " (" + e[1] + ")"; });
    if (weak.length) extra = '<p class="tiny">Review: ' + weak.join(" · ") + '</p>';
  } else { head = pct >= 80 ? "STRONG RUN" : "KEEP DRILLING"; sub = "Accuracy " + pct + "%."; }
  return hud("results") +
    '<div class="card" style="text-align:center;margin-top:20px"><p class="tiny">' + V.score + ' of ' + n + ' correct</p><h1 class="big" style="color:#fff;text-shadow:none">' + (V.mode === "exam" ? head : pct + "%") + '</h1>' +
    (V.mode === "exam" ? "" : '<h2>' + head + '</h2>') + '<p>' + sub + '</p>' + extra + '</div>' +
    '<div class="row">' + B("btn", "again", "again", "Run again", " data-af") + B("btn", "done", "back", "Done") + '</div>';
}

function screens() { return ({ home: home, camp: camp, domain: domain, intel: intel, quiz: quiz, result: result })[V.scr](); }

/* ===================== NAVIGATION ===================== */
function startQuiz(mode) {
  V.mode = mode; V.qi = 0; V.ans = null; V.score = 0; V.miss = {};
  V.Q = mode === "drill" ? moduleQs(V.d, V.mi) : mode === "rapid" ? Array.from({ length: 15 }, () => anyQ(weightedDomain())) : mode === "exam" ? examQs(45) : Array.from({ length: 15 }, acrQ);
}
function push(scr) { V.scr = scr; history.pushState({ scr: scr, d: V.d, mi: V.mi, mode: V.mode }, ""); render(true); }
function back() { if (history.state && history.state.scr !== "home") history.back(); else { V.scr = "home"; render(true); } }
window.addEventListener("popstate", e => {
  const st = e.state || { scr: "home" };
  V.d = st.d || 0; V.mi = st.mi || 0;
  if (st.scr === "quiz" || st.scr === "result") { startQuiz(st.mode || "rapid"); V.scr = "quiz"; }
  else if (st.scr === "intel") { V.i = 0; V.scr = "intel"; }
  else V.scr = st.scr;
  render(true);
});

function act(ds) {
  switch (ds.act) {
    case "back": back(); return;
    case "go": if (ds.to === "camp") push("camp"); else { startQuiz(ds.to); push("quiz"); } return;
    case "dom": V.d = +ds.d; push("domain"); return;
    case "mod": V.mi = +ds.i; V.i = 0; push("intel"); return;
    case "card": { const n = DOM[V.d].m[V.mi].t.length; V.i = (V.i + (+ds.dir) + n) % n; break; }
    case "drill": startQuiz("drill"); V.scr = "quiz"; history.replaceState({ scr: "quiz", d: V.d, mi: V.mi, mode: "drill" }, ""); render(true); return;
    case "ans": {
      if (V.ans !== null) break;
      V.ans = +ds.j; const q = V.Q[V.qi];
      if (V.ans === q.a) { V.score++; S.xp += V.mode === "exam" ? 0 : 5; save(); }
      else if (q.tag) { const k = q.tag.join("-"); V.miss[k] = (V.miss[k] || 0) + 1; }
      break;
    }
    case "next":
      if (V.qi < V.Q.length - 1) { V.qi++; V.ans = null; render(true); return; }
      finishQuiz(); V.scr = "result"; history.replaceState({ scr: "result", d: V.d, mi: V.mi, mode: V.mode }, ""); render(true); return;
    case "again": startQuiz(V.mode); V.scr = "quiz"; render(true); return;
  }
  render(false);
}
function finishQuiz() {
  const pct = V.score / V.Q.length;
  if (V.mode === "drill" && pct >= 0.8) { const k = V.d + "-" + V.mi; if (!S.clr[k]) { S.clr[k] = 1; S.xp += 50; } }
  if (V.mode === "exam") { const sc = Math.round(100 + 800 * pct); if (sc > S.best) S.best = sc; S.xp += V.score * 5; }
  save();
}

function render(fresh) {
  const app = document.getElementById("app");
  const prev = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
  app.innerHTML = screens();
  const ok = el => el && !el.disabled;
  let t = app.querySelector("[data-af]");
  if (!ok(t) && !fresh && prev) t = app.querySelector('[data-k="' + prev + '"]');
  if (!ok(t)) t = app.querySelector("[data-first]:not(:disabled)");
  if (!ok(t)) t = app.querySelector("button:not(:disabled)");
  if (t) t.focus({ preventScroll: true });
}
document.getElementById("app").addEventListener("click", e => { const t = e.target.closest("[data-act]"); if (t && !t.disabled) act(Object.assign({}, t.dataset)); });
document.addEventListener("keydown", e => { if (e.key === "Escape" || e.key === "Backspace") { e.preventDefault(); back(); } });

history.replaceState({ scr: "home" }, "");
render(true);
</script>
</body>
</html>
